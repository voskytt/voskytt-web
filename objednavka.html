<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Předobjednávka BADAMAN — VOSKYTT.">
  <meta name="theme-color" content="#0a0a0a">
  <title>Předobjednávka — VOSKYTT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="order-page">
  <header class="site-header order-header">
    <a class="logo" href="index.html" aria-label="VOSKYTT domů"><img src="voskytt-logo.png" alt="VOSKYTT"></a>
    <nav><a href="index.html">ZPĚT NA WEB</a></nav>
  </header>

  <main class="order-main">
    <section class="order-intro reveal">
      <p class="eyebrow">LIMITED DROP</p>
      <h1>PŘEDOBJEDNÁVKA</h1>
      <p>Vyplň údaje níže. Po kontrole objednávky ti pošleme platební údaje na e-mail.</p>
    </section>

    <section class="order-section reveal">
      <form class="order-form" action="https://formsubmit.co/voskytt@icloud.com" method="POST">
        <input type="hidden" name="_subject" value="Nová objednávka VOSKYTT — BADAMAN">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_captcha" value="false">
        <input type="text" name="_honey" class="hidden-field" tabindex="-1" autocomplete="off">

        <div class="form-row two-cols">
          <label>Jméno a příjmení
            <input type="text" name="Jméno" autocomplete="name" required>
          </label>
          <label>E-mail
            <input type="email" name="E-mail" autocomplete="email" required>
          </label>
        </div>

        <div class="form-row two-cols">
          <label>Telefon
            <input type="tel" name="Telefon" autocomplete="tel" required>
          </label>
          <label>Produkt
            <select id="orderProduct" name="Produkt" required>
              <option value="">Vyber produkt</option>
              <option value="BADAMAN TEE" data-price="799">BADAMAN TEE — 799 Kč</option>
              <option value="BADAMAN JERSEY" data-price="899">BADAMAN JERSEY — 899 Kč</option>
            </select>
          </label>
        </div>

        <div class="form-row two-cols">
          <label>Velikost
            <select name="Velikost" required>
              <option value="">Vyber velikost</option>
              <option>S</option><option>M</option><option>L</option><option>XL</option><option>XXL</option>
            </select>
          </label>
          <label>Počet kusů
            <select id="quantity" name="Počet kusů" required>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
            </select>
          </label>
        </div>

        <div class="form-row two-cols">
          <label>Země
            <select name="Země" required>
              <option value="">Vyber zemi</option>
              <option>Česká republika</option>
              <option>Slovensko</option>
            </select>
          </label>
          <label>Zásilkovna — pobočka
            <input type="text" name="Pobočka Zásilkovny" placeholder="Název, adresa nebo kód pobočky" required>
          </label>
        </div>

        <div class="form-row">
          <label>Poznámka
            <textarea name="Poznámka" rows="4" placeholder="Nepovinné"></textarea>
          </label>
        </div>

        <label class="consent">
          <input type="checkbox" required>
          <span>Souhlasím se zpracováním údajů za účelem vyřízení objednávky.</span>
        </label>

        <input type="hidden" id="orderTotalInput" name="Celková cena">
        <div class="order-total">
          <span>CELKEM VČETNĚ DOPRAVY</span>
          <strong id="orderTotal">—</strong>
        </div>

        <button class="button button-submit" type="submit">ODESLAT OBJEDNÁVKU</button>
        <p class="form-note">Doprava přes Zásilkovnu stojí 89 Kč. Platba proběhne bankovním převodem až po potvrzení objednávky.</p>
      </form>
    </section>
  </main>

  <footer>
    <span>© <span id="year"></span> VOSKYTT</span>
    <span><a href="mailto:voskytt@icloud.com">voskytt@icloud.com</a></span>
  </footer>
  <script src="script.js"></script>
</body>
</html>
