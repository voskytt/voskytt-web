<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Předobjednávka BADAMAN — VOSKYTT.">
  <meta name="theme-color" content="#0a0a0a">
  <title>Objednávka — VOSKYTT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html" aria-label="VOSKYTT domů"><img src="voskytt-logo.png" alt="VOSKYTT"></a>
    <nav>
      <a href="index.html#shop">KOLEKCE</a>
      <a href="index.html#info">INFO</a>
      <a href="https://www.instagram.com/voskytt/" target="_blank" rel="noopener">@VOSKYTT</a>
    </nav>
  </header>

  <main class="order-page">
    <div class="order-shell">
      <a class="order-back" href="index.html#shop">← ZPĚT KE KOLEKCI</a>
      <div class="order-intro reveal">
        <p class="eyebrow">LIMITED DROP</p>
        <h1>OBJEDNÁVKA</h1>
        <p>Vyplň údaje níže. Po přijetí objednávky ti zašleme platební informace e-mailem.</p>
      </div>

      <form class="order-form reveal" id="orderForm" action="https://formsubmit.co/voskytt@icloud.com" method="POST">
        <input type="hidden" name="_subject" value="Nová objednávka VOSKYTT — BADAMAN">
        <input type="hidden" name="_next" value="https://voskytt.cz/dekujeme.html">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="Celková cena" id="hiddenTotal" value="888 Kč">

        <div class="form-row two-cols">
          <label>Jméno a příjmení
            <input type="text" name="Jméno a příjmení" autocomplete="name" required>
          </label>
          <label>E-mail
            <input type="email" name="E-mail" autocomplete="email" required>
          </label>
        </div>

        <div class="form-row two-cols">
          <label>Telefon
            <input type="tel" name="Telefon" autocomplete="tel" required>
          </label>
          <label>Produkt
            <select id="product" name="Produkt" required>
              <option value="BADAMAN TEE" data-price="799">BADAMAN TEE — 799 Kč</option>
              <option value="BADAMAN JERSEY" data-price="899">BADAMAN JERSEY — 899 Kč</option>
            </select>
          </label>
        </div>

        <div class="form-row two-cols">
          <label>Velikost
            <select name="Velikost" required>
              <option value="">Vyber velikost</option>
              <option>S</option><option>M</option><option>L</option><option>XL</option><option>XXL</option>
            </select>
          </label>
          <label>Počet kusů
            <select id="quantity" name="Počet kusů" required>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
            </select>
          </label>
        </div>

        <div class="form-row two-cols">
          <label>Země
            <select name="Země" required>
              <option>Česká republika</option>
              <option>Slovensko</option>
            </select>
          </label>
          <label>Pobočka Zásilkovny
            <input type="text" name="Pobočka Zásilkovny" placeholder="Název, adresa nebo kód pobočky" required>
          </label>
        </div>

        <div class="form-row">
          <label>Poznámka
            <textarea name="Poznámka" rows="3" placeholder="Nepovinné"></textarea>
          </label>
        </div>

        <label class="consent">
          <input type="checkbox" required>
          <span>Souhlasím s použitím zadaných údajů pro vyřízení objednávky.</span>
        </label>

        <div class="order-total">
          <span>CELKEM VČETNĚ DOPRAVY</span>
          <strong id="totalPrice">888 Kč</strong>
        </div>

        <button class="button button-submit" type="submit">ODESLAT OBJEDNÁVKU</button>
        <p class="form-note">Doprava přes Zásilkovnu: 89 Kč. Platba bankovním převodem po potvrzení objednávky.</p>
      </form>
    </div>
  </main>

  <script src="script.js"></script>
  <script src="order.js"></script>
</body>
</html>
