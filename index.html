<!doctype html>
<html lang="cs">
<head>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:#070707;color:#f4f4f2;font-family:Inter,Arial,sans-serif}
    body{min-height:100dvh;overflow-x:hidden}.page{min-height:100dvh;display:flex;flex-direction:column;position:relative;background:radial-gradient(circle at 50% 42%,#171717 0,#0b0b0b 34%,#070707 70%)}
    .page:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.18;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,transparent,black 20%,black 80%,transparent)}
    header{height:90px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(24px,5vw,76px);position:relative;z-index:2;border-bottom:1px solid #202020}
    header img{display:block;width:128px;height:auto;filter:brightness(0) invert(1)}
    header a{color:#aaa;text-decoration:none;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;transition:.2s}header a:hover{color:#fff}
    main{flex:1;display:grid;place-items:center;padding:64px 24px 80px;position:relative;z-index:1}.content{width:min(100%,1040px);text-align:center}
    .eyebrow{margin:0 0 24px;font-size:11px;font-weight:800;letter-spacing:.34em;color:#8e8e8e}.badaman{display:block;width:min(430px,72vw);max-height:150px;object-fit:contain;margin:0 auto 30px;filter:brightness(0) invert(1)}
    h1{margin:0;font-size:clamp(54px,10vw,138px);line-height:.86;letter-spacing:-.065em;font-weight:900}.line{width:72px;height:2px;background:#fff;margin:42px auto 36px}.lead{max-width:680px;margin:0 auto;font-size:clamp(17px,2vw,22px);line-height:1.65;color:#bababa}.lead strong{color:#fff;font-weight:600}
    .status{width:min(100%,680px);margin:52px auto 0;padding:24px 26px;border:1px solid #292929;background:rgba(12,12,12,.75);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;text-align:left}.status-item:last-child{text-align:right}.status small{display:block;margin-bottom:7px;font-size:9px;font-weight:800;letter-spacing:.22em;color:#666}.status strong{font-size:13px;letter-spacing:.05em}.dot{width:5px;height:5px;background:#fff;border-radius:50%}
    .cta{margin-top:42px;display:inline-flex;align-items:center;justify-content:center;min-width:205px;height:52px;padding:0 24px;border:1px solid #4b4b4b;color:#fff;text-decoration:none;font-size:11px;font-weight:800;letter-spacing:.17em;transition:.25s}.cta:hover{background:#fff;color:#080808;border-color:#fff}
    footer{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:18px;padding:26px clamp(24px,5vw,76px);border-top:1px solid #202020;color:#555;font-size:10px;letter-spacing:.13em}footer a{color:#777;text-decoration:none}
    @media(max-width:650px){header{height:72px;padding:0 20px}header img{width:105px}main{padding:48px 20px 58px}.eyebrow{margin-bottom:20px}.badaman{margin-bottom:25px}h1{font-size:clamp(52px,18vw,78px)}.line{margin:32px auto 27px}.lead{font-size:16px;line-height:1.65}.status{margin-top:38px;padding:20px;grid-template-columns:1fr;gap:17px}.status-item:last-child{text-align:left}.dot{display:none}.cta{margin-top:30px;width:100%}footer{padding:22px 20px;flex-direction:column;align-items:flex-start;line-height:1.6}}
  </style>
</head>
<body>
<div class="page">
  <header>
    <img src="voskytt-logo.png" alt="VOSKYTT">
    <a href="https://www.instagram.com/voskytt/" target="_blank" rel="noopener">@VOSKYTT</a>
  </header>
  <main>
    <div class="content">
      <p class="eyebrow">BADAMAN DROP / CLOSED</p>
      <img class="badaman" src="badaman-logo.png" alt="Badaman">
      <h1>DĚKUJEME.</h1>
      <div class="line"></div>
      <p class="lead"><strong>BADAMAN DROP je u konce.</strong><br>Děkujeme všem, kteří byli jeho součástí a podpořili VOSKYTT. Objednávky jsou nyní uzavřeny.</p>
      <div class="status">
        <div class="status-item"><small>DROP STATUS</small><strong>OBJEDNÁVKY UZAVŘENY</strong></div>
        <span class="dot"></span>
        <div class="status-item"><small>DALŠÍ INFORMACE</small><strong>SLEDUJ @VOSKYTT</strong></div>
      </div>
      <a class="cta" href="https://www.instagram.com/voskytt/" target="_blank" rel="noopener">SLEDOVAT @VOSKYTT</a>
    </div>
  </main>
  <footer><span>© 2026 VOSKYTT</span><span>BADAMAN DROP — CLOSED</span></footer>
</div>
</body>
</html>
